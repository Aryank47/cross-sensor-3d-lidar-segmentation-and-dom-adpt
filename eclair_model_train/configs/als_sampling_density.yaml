# Repository-native ECLAIR/DALES ALS sampling-density analysis.
# Run from the project repository root after copying this package into it.

run:
  output_dir: ./runs/als_sampling_density
  seed: 1337

dataset_order: [ECLAIR, DALES]

datasets:
  eclair:
    training_config: configs/e0_eclair_dropI.yaml
    native_to_common_mapping: configs/mapping_eclair_to_common.yaml
    train_to_common_mapping: configs/train_id_to_common_id.yaml
    split: train
    max_tiles: 11
    use_project_cache: true
    # ECLAIR tiles are nominally 100m x 100m. Partial edge tiles are excluded
    # from the population-density study and listed in skipped_tiles.csv.
    footprint:
      mode: nominal_square
      nominal_size_m: 100.0
      min_extent_fraction: 0.90
      max_extent_overshoot_m: 1.0
      exclude_partial_tiles: true

  dales:
    training_config: configs/e0_dales_dropI.yaml
    native_to_common_mapping: configs/mapping_dales_to_common.yaml
    train_to_common_mapping: configs/train_id_to_common_dales.yaml
    split: train
    max_tiles: 11
    use_project_cache: true
    # False permits a validated LAS fallback when a raw cache entry is absent.
    # Set true after the pilot if every selected tile is known to be cached.
    require_project_cache: false
    footprint:
      mode: nominal_square
      nominal_size_m: 500.0
      min_extent_fraction: 0.90
      max_extent_overshoot_m: 1.0
      exclude_partial_tiles: true

validation:
  strict_returns: true
  # Candidate counts use a selection-grid integral image. Exact selected-window
  # counts are recomputed from raw points; only a tiny edge difference is allowed.
  max_candidate_count_difference: 100

sampling:
  # Population estimates use ONLY primary_random windows.
  window_sizes_m: [20.0, 50.0, 100.0]
  windows_per_tile_per_size: 5
  candidate_multiplier: 8
  selection_grid_m: 1.0
  min_points_per_window: 500
  max_overlap_fraction: 0.25

  # Project common IDs: 4 wires, 5 poles, 6 fence, 7 vehicle.
  # These windows are diagnostic and excluded from global statistical estimates.
  diagnostic_common_class_ids: [4, 5, 6, 7]
  diagnostic_windows_per_class_per_size: 1
  min_focus_points: 25

metrics:
  grid_resolutions_m: [0.5, 1.0, 2.0, 5.0]
  class_occupied_area_grid_m: 1.0

  knn_enabled: true
  knn_k_values: [1, 4, 8, 16]
  max_knn_points_per_subset: 100000
  max_knn_points_per_class: 30000
  min_class_points_for_knn: 100
  knn_common_class_ids: [1, 2, 3, 4, 5, 6, 7]

  model_voxel_enabled: true
  # ECLAIR is trained as a full tile. Build its native voxel map once per tile
  # and slice windows through the inverse map so boundary pooling remains exact.
  native_eclair_full_tile_voxel_context: true
  # These are physical metres and are converted into each config's normalized
  # voxel units. Native views additionally use the exact source training config.
  controlled_physical_voxel_sizes_m: [0.20, 0.40, 0.50, 1.00]
  max_points_for_model_voxelization: 3000000

statistics:
  bootstrap_iterations: 2000

plots:
  professor_window_size_m: 50.0
  heatmap_resolution_m: 1.0
  # Both datasets use one shared display probability based on the denser window;
  # this preserves relative visual density instead of capping both at equal N.
  scatter_budget_for_denser_window: 180000
  dpi: 240
  save_individual_diagnostics: true
  max_individual_diagnostics_per_dataset: 12

export:
  # Usually false on the VM. Figures are regenerated by reloading only selected
  # windows, avoiding a large directory of duplicate raw point crops.
  save_selected_window_npz: false
