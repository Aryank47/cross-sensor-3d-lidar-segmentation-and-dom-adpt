extends: dg_dales_ocons10.yaml

# Full-data pilot reaches the DALES StepLR boundary at epoch 20 and then runs
# one post-decay epoch. The Slurm wrapper interrupts after epoch 2 and resumes.
epochs: 21

run:
  name: pilot_dales_ocons10
  out_dir: /scratch/m23csa510/e0_results/pilot_dales_ocons10
  log_every_steps: 25
  eval_every_epochs: 2
  save_every_epochs: 1
  keep_epoch_snapshots: false
  keep_last_k_epoch_snapshots: 0
  best_checkpoint_model_only: true
  epoch_snapshots_model_only: true
  max_run_dir_gb: 1.0
  max_train_batches_per_epoch: 0
  skip_validation: false
  skip_final_test: true
  resume_split_epoch: 2

data:
  num_workers: 4
  prefetch_factor: 4
