epochs: 200

run:
  name: m1_dales_mix3d
  out_dir: /scratch/m23csa510/e0_results/e0_dales_train_29364
  seed: 1337
  device: cuda
  amp: true
  log_every_steps: 50
  eval_every_epochs: 2
  save_every_epochs: 25
  keep_epoch_snapshots: false
  keep_last_k_epoch_snapshots: 0
  best_checkpoint_model_only: true
  epoch_snapshots_model_only: true
  max_run_dir_gb: 20.0

eval:
  mode: point
  window:
    size_xy_m: 50.0
    stride_xy_m: 25.0
    aggregation: mean_logits
    accum_dtype: float32
    compute_point_loss: true
  bev:
    enabled: false
    every_epochs: 5
    max_batches: 2
    save_npz: true
    save_png: true
    levels: null
  tta:
    enabled: false
    rotations_deg:
      - 0.0
      - 90.0
      - 180.0
      - 270.0
    scales:
      - 1.0
    vote_aggregation: mean_logits

data:
  voxelization:
    feat_pool: mean_all
    label_pool: majority
    random_seed_offset: 0

  mix3d:
    enabled: true
    policy: crop_replace
    probability: 1.0
    replacement_area_fraction: 0.25
    guard_band_voxels: 1
    donor_file_strategy: uniform_different_source_file
    max_donor_attempts: 8
    max_region_attempts: 8
    min_region_points: 2000
    min_replacement_side_m: 5.0
    height_alignment: q05_local
    verify_cross_provenance_collisions: true
    diagnostics: true

  dataset: dales
  split_manifest_dir: /scratch/m23csa510/dales/manifests

  dales_label_map_native_to_train:
    0: -100
    1: 0
    2: 1
    3: 2
    4: 3
    5: 6
    6: 7
    7: 5
    8: 4
  dales_train_root: ${DALES_TRAIN_ROOT}
  dales_test_root: ${DALES_TEST_ROOT}
  val_fraction_from_train: 0.1
  num_workers: 4
  batch_size: 1
  grad_accum_steps: 3
  use_cache: true
  cache_root: ${DALES_CACHE_ROOT_DROP_I}
  cache_subdir: dales_dropI
  cache_key_extra: e0_dales_dropI_v2_labels8
  cache_kind: raw
  require_cache: true
  write_cache: false

  patch:
    make_local_coords: true
    coord_norm_factor: 10.0
    voxel_size: 0.02

  prefetch_factor: 4

  sampling:
    mode: crops
    crop_size_xy_m: 120.0
    crop_min_points: 2000
    crops_per_tile_per_epoch: 12
    crops_per_item: 1
    rare_center_prob: 0.6
    rare_center_class_ids:
      - 3
      - 5
      - 6
    rare_center_class_weights:
      6: 3.0
      5: 2.0
    rare_center_balance_beta: 0.5
    max_voxels_per_crop_soft: 650000
    max_voxels_per_crop_hard: 700000
    min_crop_size_xy_m: 8.0
    shrink_ratio: 0.85
    max_shrink_steps: 6
    hard_max_points: 300000
    max_points_per_crop_soft: null
    resample_tries: 25
  preproc:
    intensity_mode: none
    use_height_xy_cap: false
    max_voxels: null
    class_aware_max_voxels: false
    rare_class_ids:
      - 2
      - 3
      - 5
      - 6
      - 7
  aug:
    enabled: true
    random_flip_xy: true
    random_rotate_deg:
      - 0.0
      - 360.0
    scale_range:
      - 0.95
      - 1.05
    jitter_std: 0.01
  features:
    use_intensity: false
    intensity_divisor: 65535.0
    returns_onehot_k: 5
    use_rgb: false
    include_coords: false
  label_space:
    num_classes: 8
    ignore_index: -100
    class_names:
      - ground
      - vegetation
      - cars
      - trucks
      - buildings
      - poles
      - power_lines
      - fences
model:
  in_channels: 10
  out_channels: 8
  D: 3
  aux_heads:
    bev:
      enabled: false
      max_batches: 5
      vis_every_epochs: 5
      loss: dice
      dice_smooth: 1.0
      dice_classes: present
      levels:
        - block8
      weight: 0.5
      ignore_index: -1
      warmup_epochs: 10
      warmup_only_bev: true
      label_pool: last
      bev_img_sizes:
        - 100
      projector:
        x_min_m: -10.0
        x_max_m: 10.0
        y_min_m: -10.0
        y_max_m: 10.0
        z_min_m: -10.0
        z_max_m: 10.0
        y_flip: true
        pool: max
        res_m: 0.2
        mode: select
      hidden_dim: 64
optim:
  name: adam
  lr: 0.001
  weight_decay: 0.0001
sched:
  name: step
  step_size_epochs: 20
  gamma: 0.8
loss:
  name: focal
  gamma: 2.0
  alpha:
    - 0.53
    - 0.53
    - 1.07
    - 1.6
    - 0.53
    - 1.6
    - 1.07
    - 1.07
  lovasz:
    enabled: true
    weight: 0.7
    warmup_epochs: 10
    ramp_epochs: 10
    classes: present
